# vim:fileencoding=utf-8:foldmethod=marker

# https://sw.kovidgoyal.net/kitty/kittens/diff

#: Diffing {{{
syntax_aliases pyj:py recipe:py
#: }}}

#: Colors {{{
pygments_style friendly_grayscale
dark_pygments_style dracula

# Theme: Rose Pine
# Basic Colors (Rose Pine Dark)
foreground      #e0def4
background      #191724
dark_foreground #e0def4
dark_background #191724

# Title Colors
title_fg        #e0def4
title_bg        #26233a
dark_title_fg   #e0def4
dark_title_bg   #26233a

# Margin Colors (Gutter)
margin_fg       #6e6a86
margin_bg       #26233a
dark_margin_fg  #6e6a86
dark_margin_bg  #26233a

# Removed Text (Rose Pine 'Rose' / 'Love')
# Background for removed lines
removed_bg           #2b1d22
highlight_removed_bg #eb6f92
removed_margin_bg    #402430

dark_removed_bg           #2b1d22
dark_highlight_removed_bg #eb6f92
dark_removed_margin_bg    #402430

# Added Text (Rose Pine 'Pine' / 'Foam')
# Background for added lines
added_bg           #1f2933
highlight_added_bg #31748f
added_margin_bg    #243b44

dark_added_bg           #1f2933
dark_highlight_added_bg #31748f
dark_added_margin_bg    #243b44

# Filler / Empty lines
filler_bg      #26233a
dark_filler_bg #26233a

# Hunk Headers (The @@ lines)
hunk_margin_bg #f6c177
hunk_bg        #26233a
dark_hunk_margin_bg #f6c177
dark_hunk_bg        #26233a

# Search and Selection
search_bg      #c4a7e7
search_fg      #191724
select_bg      #403d52
select_fg      #e0def4

dark_search_bg #c4a7e7
dark_search_fg #191724
dark_select_bg #403d52
dark_select_fg #e0def4
#: }}}
