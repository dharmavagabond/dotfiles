TMUX_DIR="$HOME/.config/tmux"

set -g default-terminal "tmux-256color"
set -as terminal-features ",kitty:RGB"

set -s escape-time 0

set -g status-position top
set -g prefix C-a
set -g base-index 1
set -g mouse on
set -g display-panes-time 4000
set -g status-left-length 30
set -g status-right-length 140
set -g status-justify centre
set -g visual-activity on
set -g allow-passthrough on
set -g renumber-windows on
set -g history-limit 50000
set -g detach-on-destroy off
set -g focus-events on

setw -g pane-base-index 1
setw -g monitor-activity on
setw -g mode-keys vi

unbind C-b

bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind C-h swap-pane -t '{left-of}'
bind C-j swap-pane -t '{down-of}'
bind C-k swap-pane -t '{up-of}'
bind C-l swap-pane -t '{right-of}'
bind & kill-window
bind r source-file "$TMUX_DIR/tmux.conf" \; display "conf reloaded"

bind -r S-h select-window -t :-
bind -r S-l select-window -t :+
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi y      send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi p      send-keys -X copy-selection-and-cancel \; paste-buffer

# Lazy load
bind C-s run-shell "$TMUX_DIR/scripts/lazy-resurrect"

set-hook -g session-created {
    if-shell -F '#{==:#{session_name},0}' { rename-session 1 }
}

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-notify'
set -g @plugin 'wfxr/tmux-power'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'joshmedeski/tmux-fzf-url'

set -g @tmux_power_theme 'colour5'
set -g @tmux_power_right_arrow_icon ''
set -g @tmux_power_left_arrow_icon  ''
set -g @tmux_power_right_z '%F #{tmux_mode_indicator}'

set -g @mode_indicator_empty_mode_style 'bg=magenta,fg=black'

set -g @continuum-save-interval '30'
set -g @continuum-restore 'off'

run "$TMUX_DIR/plugins/tpm/tpm"
