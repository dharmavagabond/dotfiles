[plugins]
enabled = [
  "noctalia/screen_recorder",
  "marccvictoria/llamanager",
  "nightwatch75/file-search",
  "lucasoe/proton-pass",
]
auto_update = "all"

[plugin_settings."noctalia/screen_recorder"]
color_range = "full"
video_codec = "hevc"
hide_inactive = true

[plugin_settings."marccvictoria/llamanager"]
launcher = "smallthinker"

[plugin_settings."nightwatch75/file-search"]
show_hidden = true
