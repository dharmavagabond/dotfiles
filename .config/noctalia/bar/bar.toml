[bar]
order = ["main"]

[bar.default]
icon_color = "primary"
capsule_radius = 6.0
start = ["group:left"]
center = ["privacy"]
end = ["group:right"]
background_opacity = 0.0
margin_ends = 0
padding = 7
shadow = false
thickness = 28
scale = 0.7
font_weight = 400
font_family = "DM Sans"

[[bar.default.capsule_group]]
id = "left"
members = [
  "control-center",
  "workspaces",
  "taskbar",
  "media",
  "audio_visualizer",
]
padding = 12.0
widget_spacing = 12

[[bar.default.capsule_group]]
id = "right"
members = [
  "tray",
  "recorder",
  "bluetooth",
  "network",
  "volume",
  "notifications",
  "weather",
  "clock",
]
padding = 12.0


[bar.default.monitor.hdmi]
match = "HDMI-A-1"
scale = 0.6
