[widget.control-center]
glyph = ""
custom_image = "~/.local/share/icons/hicolor/scalable/apps/cachyos-linux.svg"
custom_image_colorize = true

[widget.workspaces]
active_pill_size = 1.0
hide_when_empty = true
occupied_color = "surface_variant"

[widget.clock]
format = "{:L%a %d %h %I:%M %p}"
font_family = "Zalando Sans"
scale = 0.9

[widget.volume]
show_label = false
mute_color = "#6e6a86" # @muted

[widget.volume.effects_profile_glyphs]
"Accentum Plus Gaming" = "device-gamepad"
"Accentum Plus Music" = "music"
"Accentum Plus Cinematic" = "movie"

[widget.tray]
drawer = true
drawer_columns = 5

[widget.weather]
show_condition = false
show_temperature = false

[widget.privacy]
hide_inactive = true
active_color = "error"

[widget.notifications]
hide_when_no_unread = true

[widget.media]
title_scroll = "on_hover"
hide_when_no_media = true

[widget.taskbar]
show_active_indicator = false
inactive_opacity = 0.6
