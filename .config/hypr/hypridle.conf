general {
  inhibit_sleep = 2
}

listener {
  timeout = 1
  on-timeout = :
  on-resume = screensaver-stop
  condition_cmd = systemctl --user --quiet is-active screensaver.service
}

# 2.45 min
listener {
  timeout = 147
  on-timeout = playerctl pause
  on-resume = playerctl play
  condition_cmd = [[ $(playerctl status) == "Playing" ]]
}

# 2.5 min
listener {
  timeout = 150
  on-timeout = sunsetr preset idle
  on-resume = sunsetr preset default
}

# 3.5 min
listener {
  timeout = 210
  on-timeout = screensaver-start
}

### AFTER the screensaver since it resets the timer ###

# 5 min
listener {
  timeout = 90
  on-timeout = loginctl lock-session
  condition_cmd = systemctl --user --quiet is-active screensaver.service
}

### AFTER lock-session since it resets the timer ###

# 5.5 min
listener {
  timeout = 30
  on-timeout = sunsetr preset idle
  on-resume = sunsetr preset default
  condition_cmd = systemctl --user --quiet is-active lock.target
}

# 6 min
listener {
  timeout = 60
  on-timeout = noctalia msg dpms-off
  on-resume = noctalia msg dpms-on
  condition_cmd = systemctl --user --quiet is-active lock.target
}

# 6.5 min
listener {
  timeout = 90
  on-timeout = system-suspend
  condition_cmd = systemctl --user --quiet is-active lock.target
}
